 #ROOT Logger
log4j.rootCategory=DEBUG, stdout, guiLifeLog

#ROOT logger property
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.conversionPattern=%d{hh:mm:ss.SSS} |%c| %m%n

#GuiLife logger property
log4j.appender.guiLifeLog = org.apache.log4j.DailyRollingFileAppender
log4j.appender.guiLifeLog.file=logs/gui_life.log
log4j.appender.guiLifeLog.layout=org.apache.log4j.PatternLayout
log4j.appender.guiLifeLog.layout.conversionPattern=[%d{dd.MM.yy HH:mm:ss.SSS}]%5p [%C{1}:%M] - %m%n
