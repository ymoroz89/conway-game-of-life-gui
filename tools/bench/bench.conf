# How to build, launch and read THIS application.
# Consumed by the skill's generic runner:
#   ~/.claude/skills/jdk-performance-comparison/scripts/run-matrix.sh
#
# Everything project-agnostic -- jenv resolution, .java-version handling, worktree
# builds, interleaving, per-round JVM options, results.jsonl -- lives in that script.
# Only what is specific to Conway lives here.

# Environment label. Goes into every filename and every result row, so a harness run
# can never be mistaken for an application run. This project measures the shipping
# GUI: window, EDT, incremental repaint. There is deliberately no headless entry here.
ENV=gui

# {WORKTREE} is the per-arm git worktree; JAVA_HOME is exported by the runner.
BUILD_CMD='mvn -q -DskipTests clean package -f {WORKTREE}/pom.xml'

# {JAVA} resolved JDK, {OPTS} the round's JVM options, {UNITS} the workload size.
# The driver bytecode is compiled once at major 65 so one build drives every JVM:
#   javac -cp tools/bench/shared-r21.jar -d tools/bench/out tools/bench/drive/GuiDrive.java
# The trailing 3 is GuiDrive's start delay in seconds, letting the window settle.
RUN_CMD='{JAVA} -XX:+UseG1GC {OPTS} -cp tools/bench/out:tools/bench/shared-r21.jar drive.GuiDrive {UNITS} 3'

# Throughput ground truth is the app's own log line, never JFR inference:
#   Run finished: 2000030 generations in 100.248 s using 4 partition(s), 19950.9 generations/s
UNITS_RE='Run finished: ([0-9]+) generations'
SECONDS_RE='generations in ([0-9.]+) s'
RATE_RE='([0-9.]+) generations/s'

# Readiness markers. macOS foreground treatment is worth up to 3.3x here, so the
# window state is recorded per run rather than assumed. Treat these as advisory:
# they sample an instant, not the whole run, so check whether they actually correlate
# with throughput -- within round and within JDK -- before discarding anything.
MARKER_START_RE='GUI-DRIVE WINDOW at-start (.*)'
MARKER_END_RE='GUI-DRIVE WINDOW at-pause (.*)'

# --- round options ---------------------------------------------------------------
# Override any round, or define rounds of your own. {JFR} expands to the flight
# recorder options. The runner verifies every arm accepts these before measuring.
#
# C1/C3 are left at JVM defaults deliberately: how each JDK sizes the heap on its own
# is the finding, so adding a heap flag there would delete the result.
#
# For the pinned rounds, prefer a young-gen *floor* over -Xmn. -Xmn pins the young
# generation and switches adaptive sizing off entirely, which answers "how do they
# compare with G1's sizing disabled" -- a question nobody asked. G1NewSizePercent
# leaves adaptation running but stops the newer JDK shrinking eden to a third of the
# older one, which is the actual confound being controlled for. Verified present and
# {experimental} on both 21 and 25, with G1MaxNewSizePercent still 60.
PINNED='-Xms1g -Xmx1g -XX:+UnlockExperimentalVMOptions -XX:G1NewSizePercent=40'
ROUND_C2="$PINNED"
ROUND_C4="$PINNED {JFR}"

# A round at the settings this app actually recommends shipping with. The README
# suggests these for interactive use, so "how do the JDKs compare under our own
# tuning" is a fair question -- just a different one from C1/C3, and it must be
# reported as such rather than folded in with them.
ROUND_shipped='-Xms256m -Xmx1g -XX:MaxGCPauseMillis=20 {JFR}'
